server:
  port: ${STORAGE_SERVICE_PORT:8088}

spring:
  banner:
    location: classpath:banner.txt
    mode: console
  application:
    name: x-storage-service
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  # Optional: import secrets file (gitignored). See application-secrets.yml.example
  config:
    import: optional:file:./application-secrets.yml,optional:file:./config/application-secrets.yml

x:
  http:
    logging:
      enabled: true
      server: x-storage-service
      hop: "x-api-gateway → x-bff → x-storage-service"
      hops:
        /api/v1/files: "x-api-gateway → x-bff → x-storage-service"
  redis:
    enabled: ${X_REDIS_ENABLED:true}
    key-prefix: x
    default-ttl: 10m
    caches:
      storage-file-by-relative-path: 15m
  storage:
    # local | s3
    type: ${X_STORAGE_TYPE:local}
    # Used when type=local — creates media/ and files/ under this root
    root-dir: ${X_STORAGE_ROOT:./uploads}
    public-base-url: ${X_STORAGE_PUBLIC_BASE_URL:http://127.0.0.1:8088}
    s3:
      bucket: ${X_S3_BUCKET:x-storage-service}
      region: ${X_S3_REGION:ap-southeast-1}
      access-key: ${X_S3_ACCESS_KEY:}
      secret-key: ${X_S3_SECRET_KEY:}
      # Leave empty for AWS. Set for MinIO, e.g. http://127.0.0.1:9000
      endpoint: ${X_S3_ENDPOINT:}
      # public = clean permanent S3 URL; presigned = signed query string
      url-mode: ${X_S3_URL_MODE:public}
      presign-duration-hours: ${X_S3_PRESIGN_HOURS:24}
